name: Job digest

on:
  schedule:
    - cron: "0 11 * * 1-5"  # 08:00 Argentina, weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1  # one person at a time: fewer LinkedIn blocks, no seen.json push conflicts
      fail-fast: false
      matrix:
        person: [andre]  # add a name here after `python setup.py <name> --upload`
    env:
      P: ${{ matrix.person }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Write private files from secrets
        run: |
          printf '%s' "$PROFILE" > "people/$P/profile.md"
          printf '%s' "$SETTINGS" > "people/$P/settings.yaml"
        env:
          PROFILE: ${{ secrets[format('PROFILE_{0}', matrix.person)] }}
          SETTINGS: ${{ secrets[format('SETTINGS_{0}', matrix.person)] }}
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: sudo apt-get install -y fonts-crosextra-carlito
      - run: python fetch.py "$P"
      - run: python tailor.py "$P"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CHROME: google-chrome
      - run: python email_digest.py "$P"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Save seen jobs
        if: always()
        run: |
          git config user.name "job-digest-bot"
          git config user.email "actions@github.com"
          git add "people/$P/seen.json"
          git commit -m "Update seen jobs ($P)" || true
          git pull --rebase
          git push
