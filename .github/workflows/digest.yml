name: Job digest

on:
  schedule:
    - cron: "0 11 * * 1-5"  # 08:00 Argentina, weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Write private files from secrets
        run: |
          printf '%s' "$MYINFO" > MyInfo.md
          printf '%s' "$CONTACT" > contact.yaml
        env:
          MYINFO: ${{ secrets.MYINFO }}
          CONTACT: ${{ secrets.CONTACT }}
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: sudo apt-get install -y fonts-crosextra-carlito
      - run: python fetch.py
      - run: python tailor.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CHROME: google-chrome
      - run: python email_digest.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
      - name: Save seen jobs
        if: always()
        run: |
          git config user.name "job-digest-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git commit -m "Update seen jobs" || true
          git push
